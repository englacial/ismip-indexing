# GitHub Actions role for the englacial/ismip-indexing Tests workflow (one-time,
# account admin). The account already has the token.actions.githubusercontent.com
# provider (ismip7-virtualize-github), so the default here creates none.
#
#   aws cloudformation deploy --region us-west-2 --stack-name ismip6-virtualize-github \
#       --template-file virtualize_ismip6/github-oidc.yaml --capabilities CAPABILITY_NAMED_IAM
#
# Then set the repository variable ISMIP6_TESTS_ROLE_ARN to the RoleArn output;
# the integration job assumes the role through OIDC instead of decrypting user
# keys. The role can rebuild the Lithops runtime (push to the lithops_* ECR
# repositories, create and delete the lithops-worker-* functions, pass the
# executor role), run it, and read and write the Lithops bucket; nothing else.
AWSTemplateFormatVersion: "2010-09-09"
Description: OIDC role that lets the ismip-indexing GitHub workflow rebuild and run the Lithops Lambda runtime
Parameters:
  Repository:
    Type: String
    Default: englacial/ismip-indexing
  ExecutionRole:
    Type: String
    Default: lithops-ismip6-executor
  Bucket:
    Type: String
    Default: ismip6-icechunk
  CreateProvider:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: "true only in an account without the token.actions.githubusercontent.com provider"
Conditions:
  MakeProvider: !Equals [!Ref CreateProvider, "true"]
Resources:
  Provider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
  Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ismip6-virtualize-github-tests
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - MakeProvider
                - !Ref Provider
                - !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                # pushes to main and pull requests of this repository
                token.actions.githubusercontent.com:sub: !Sub repo:${Repository}:*
      Policies:
        - PolicyName: rebuild-and-run-lithops-runtime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:CreateRepository
                  - ecr:DescribeRepositories
                  - ecr:DescribeImages
                  - ecr:ListImages
                  - ecr:BatchDeleteImage
                  - ecr:BatchCheckLayerAvailability
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource: !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/lithops_*
              - Effect: Allow
                Action:
                  - lambda:CreateFunction
                  - lambda:DeleteFunction
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:InvokeFunction
                  - lambda:TagResource
                Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:lithops-worker-*
              - Effect: Allow
                Action: lambda:ListFunctions
                Resource: "*"
              - Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/${ExecutionRole}
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - !Sub arn:aws:s3:::${Bucket}
                  - !Sub arn:aws:s3:::${Bucket}/*
Outputs:
  RoleArn:
    Value: !GetAtt Role.Arn
